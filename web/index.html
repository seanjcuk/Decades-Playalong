<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decades – Play-Along Wheel</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1f2a44;--mut:#6b7285;--line:#d9d4c7;--s1:#fff;--s2:#efe9da;--ok:#1e8e5a;--bad:#c4423a;--acc:#2f5bd3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121828;--card:#1c2438;--ink:#eef0f6;--mut:#9aa3ba;--line:#33405e;--s1:#222c45;--s2:#2b3756;--ok:#3cc487;--bad:#ff7a70;--acc:#6f93ff}}
:root[data-theme="dark"]{--bg:#121828;--card:#1c2438;--ink:#eef0f6;--mut:#9aa3ba;--line:#33405e;--s1:#222c45;--s2:#2b3756;--ok:#3cc487;--bad:#ff7a70;--acc:#6f93ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font:700 1.5rem/1.2 Georgia,serif;margin:0}
.mut{color:var(--mut);font-size:.88rem}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 10px}
.d{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);font-size:.65rem;display:grid;place-items:center;color:var(--mut)}
.d.cur{border-color:var(--acc);color:var(--acc);font-weight:700}
.d.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.d.miss{background:var(--bad);border-color:var(--bad);color:#fff}
.d.skip{background:var(--line)}
svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.w{border:3px solid;border-radius:10px;padding:7px 11px;font-weight:700;background:var(--card);min-width:52px}
.w.sel{color:#fff}
.w.used{opacity:.3;text-decoration:line-through}
button{font:inherit;color:var(--ink);cursor:pointer}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.b{border:0;border-radius:10px;padding:12px;font-weight:700;color:#fff}
.b.ok{background:var(--ok)}.b.no{background:var(--bad)}
.b.alt{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600;padding:9px}
.b:disabled{opacity:.4;cursor:default}
.row3{display:flex;gap:8px;margin-top:8px}.row3 .b{flex:1}
.end{text-align:center;padding:14px;border:2px solid var(--line);border-radius:14px;margin:8px 0}
.end h2{font:700 1.5rem Georgia,serif;margin:0 0 4px}
</style>
</head>
<body>
<main>
<div class="top"><h1>Decades</h1><span class="mut" id="cnt"></span></div>
<div class="dots" id="dots"></div>
<svg id="wh" viewBox="0 0 400 400" role="img" aria-label="Time Wheel, 1950 to 2020"></svg>
<div class="tray" id="tray"></div>
<div id="end"></div>
<div class="acts">
  <button class="b ok" id="hit" disabled>✓ Hit</button>
  <button class="b no" id="miss" disabled>✗ Missed</button>
</div>
<div class="row3">
  <button class="b alt" id="skip">No guess</button>
  <button class="b alt" id="undo">Undo</button>
  <button class="b alt" id="reset">New game</button>
</div>
<p class="mut" style="text-align:center">Pick a window, then drag or tap on the wheel. When the host reveals the year, tap Hit or Missed. Hit sets the window aside; Missed keeps it.</p>
</main>
<script>
const N=71,S=360/N,COL=['#e5484d','#f08a24','#d9ae12','#3fb36b','#2fa5b8','#3e63dd','#9b59d0'];
const svg=document.getElementById('wh'),$=id=>document.getElementById(id);
let G;
function fresh(){return{used:[],sel:null,start:null,ev:1,log:[]}}
try{G=JSON.parse(localStorage.getItem('dd1')||'null')}catch(e){}
if(!G||!Array.isArray(G.used))G=fresh();
function save(){try{localStorage.setItem('dd1',JSON.stringify(G))}catch(e){}}
const a=i=>i*S-90;
const pt=(r,d)=>{const t=d*Math.PI/180;return[(200+r*Math.cos(t)).toFixed(1),(200+r*Math.sin(t)).toFixed(1)]};
function sector(a0,a1,r1,r2){const[x1,y1]=pt(r2,a0),[x2,y2]=pt(r2,a1),[x3,y3]=pt(r1,a1),[x4,y4]=pt(r1,a0),lg=a1-a0>180?1:0;
  return`M${x1} ${y1}A${r2} ${r2} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 ${lg} 0 ${x4} ${y4}Z`}
function build(){
  let h='<circle cx="200" cy="200" r="196" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>';
  for(let i=0;i<N;i++){
    h+=`<path d="${sector(a(i),a(i+1),118,188)}" fill="var(${Math.floor(i/10)%2?'--s2':'--s1'})" stroke="var(--line)" stroke-width=".5"/>`;
    const c=a(i)+S/2,[x,y]=pt(153,c),dec=i%10===0;
    h+=`<text x="${x}" y="${y}" transform="rotate(${c.toFixed(1)} ${x} ${y})" text-anchor="middle" dominant-baseline="central" font-size="9" ${dec?'font-weight="700"':''} fill="var(--ink)">${1950+i}</text>`;
  }
  h+='<g id="win"></g><g id="mid"></g>';
  svg.innerHTML=h;
}
function draw(){
  const n=G.sel,s=G.start;let w='';
  if(n&&s!=null){
    w=`<path d="${sector(a(s),a(s+n),112,194)}" fill="${COL[n-1]}" fill-opacity=".18" stroke="${COL[n-1]}" stroke-width="5" stroke-linejoin="round"/>`;
  }
  $('win').innerHTML=w;
  const rng=n&&s!=null?(n===1?`${1950+s}`:`${1950+s}–${1950+s+n-1}`):'';
  $('mid').innerHTML=`<text x="200" y="178" text-anchor="middle" font-size="12" fill="var(--mut)">EVENT</text>
  <text x="200" y="214" text-anchor="middle" font-size="40" font-weight="700" font-family="Georgia,serif" fill="var(--ink)">${Math.min(G.ev,15)}</text>
  <text x="200" y="236" text-anchor="middle" font-size="12" fill="var(--mut)">of 15</text>
  <text x="200" y="262" text-anchor="middle" font-size="17" font-weight="700" fill="${n?COL[n-1]:'var(--mut)'}">${rng||(n?'tap the wheel':'pick a window')}</text>`;
}
function ui(){
  const over=G.used.length===7||G.ev>15,placed=G.sel&&G.start!=null;
  $('cnt').textContent=`${G.used.length}/7 windows placed`;
  let d='';for(let i=1;i<=15;i++){const l=G.log[i-1];d+=`<div class="d ${l?l.r:(i===G.ev&&!over?'cur':'')}">${l?'':i}</div>`}
  $('dots').innerHTML=d;
  $('tray').innerHTML=[1,2,3,4,5,6,7].map(n=>{const u=G.used.includes(n),s=G.sel===n;
    return`<button class="w${u?' used':''}${s?' sel':''}" data-n="${n}" style="border-color:${COL[n-1]};${s?'background:'+COL[n-1]:''}" ${u||over?'disabled':''}>${n} yr${n>1?'s':''}</button>`}).join('');
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{G.sel=+b.dataset.n;if(G.start!=null)G.start=Math.max(0,Math.min(G.start,N-G.sel));ui()});
  $('hit').disabled=$('miss').disabled=!placed||over;$('skip').disabled=over;$('undo').disabled=!G.log.length;
  $('end').innerHTML=over?(G.used.length===7?`<div class="end"><h2 class="" style="color:var(--ok)">You win!</h2>All seven windows placed by event ${G.log.length}.</div>`:`<div class="end"><h2>Game over</h2>${G.used.length} of 7 windows placed in 15 events.</div>`):'';
  draw();save();
}
function step(r){
  if(G.ev>15)return;
  const n=G.sel,s=G.start;
  G.log.push({r,n:r==='skip'?0:n,s:r==='skip'?null:s});
  if(r==='hit')G.used.push(n);
  G.ev++;G.sel=null;G.start=null;ui();
}
$('hit').onclick=()=>step('hit');$('miss').onclick=()=>step('miss');$('skip').onclick=()=>step('skip');
$('undo').onclick=()=>{const l=G.log.pop();if(!l)return;if(l.r==='hit')G.used=G.used.filter(x=>x!==l.n);G.ev--;G.sel=l.n||null;G.start=l.s;ui()};
$('reset').onclick=()=>{if(confirm('Start a new game?')){G=fresh();ui()}};
let drag=false;
function at(e){
  if(!G.sel||G.ev>15)return;
  const r=svg.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  if(Math.hypot(dx,dy)<r.width*.2)return;
  let deg=Math.atan2(dy,dx)*180/Math.PI+90;deg=(deg+360)%360;
  const slot=Math.floor(deg/S);
  G.start=Math.max(0,Math.min(N-G.sel,slot-Math.floor((G.sel-1)/2)));ui2();
}
function ui2(){draw();const p=G.sel&&G.start!=null;$('hit').disabled=$('miss').disabled=!p}
svg.addEventListener('pointerdown',e=>{drag=true;svg.setPointerCapture(e.pointerId);at(e)});
svg.addEventListener('pointermove',e=>{if(drag)at(e)});
svg.addEventListener('pointerup',()=>{drag=false;save()});
build();ui();
</script>
</body>
</html>
